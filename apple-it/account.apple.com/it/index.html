  .init-loading {
    display: flex;

      position: relative;
      height: 32px;
      width: 32px;
  }

  .init-loading-spinner .init-loading-spinner-container {
      position: absolute;
      top: 50%;
      width: 0;
      z-index: 1;
      transform:scale(.15);
      right: 50%;
  }

  .init-loading-spinner .init-loading-spinner-nib {
      height: 28px;

      top: -12.5px;
      width:66px;
      background: transparent;
      border-radius:25%/50%;
      transform-origin:right center;
  }

      content: "";
      display: block;
      height: 100%;
      width: 100%;
      background: #000;

      animation-duration: .8s;
      animation-fill-mode: none;

      animation-play-state: running;

      animation-delay:-.8s
  }

      transform:rotate(-45deg) translateX(-40px)

      animation-delay:-.5s
  }

  .init-loading-spinner .init-loading-spinner-nib.init-loading-spinner-nib-5 {
      transform:rotate(-180deg) translateX(-40px)

      animation-delay:-.4s
  }

one.\u003C\/a\u003E","web.portal.sideNavigation.axLabel":"Navigazione laterale","web.portal.nav.profile.image":"Profilo","web.portal.localnav.title":"Apple Account","web.portal.localnav.open":"Apri menu","web.portal.localnav.close":"Chiudi menu","web.portal.signout.button.label":"Esci","web.portal.localnav.item.signIn":"Accedi","web.portal.localnav.item.create":"Crea il tuo Apple Account","web.portal.localnav.item.faq":"Domande frequenti","web.faq.title.full":"Domande frequenti","landing.manageAccount":"Gestisci il tuo Apple Account","web.portal.landing.headline":"Un solo account per tutti i servizi Apple","web.portal.landing.intro":"Un unico Apple Account abbinato a una password ti consente di accedere a tutti i servizi Apple.","web.portal.landing.intro.line.2":"Effettua l’accesso per gestire il tuo account.","web.portal.landing.signIn":"Accedi","web.portal.landing.block.left.headline":"Hai tutto sotto controllo","web.portal.landing.block.left.paragraph":"Verifica o aggiorna informazioni importanti come nome, password e dettagli relativi alla sicurezza. Visualizza le modalità con cui gli altri possono contattarti, controlla le tue informazioni di pagamento e gestisci i dispositivi associati al tuo account.","web.portal.landing.block.right.headline":"Privato e sicuro","web.portal.landing.block.right.paragraph":"Privacy e sicurezza sono integrate. Con funzioni volte a garantire la sicurezza dell’account, come l’autenticazione a due fattori, Apple ti aiuta a mantenere il tuo account al sicuro, protegge la tua privacy e ti consente di avere sempre il controllo delle tue informazioni.","web.portal.landing.faq.whatIsAppleId":"Cos’è un Apple Account?","web.portal.landing.faq.whatIsAppleId.description":"Un Apple Account è l’account personale con cui puoi accedere a servizi Apple come App Store, iCloud, Messaggi, Apple Online Store, FaceTime e altro ancora. Include i tuoi dati di accesso e tutte le informazioni di contatto, pagamento e sicurezza che userai nei servizi Apple.","web.faq.question.differenceBetweenIdAndAccount":"Qual è la differenza tra ID Apple ed Apple Account?","web.faq.answer.differenceBetweenIdAndAccount":"Con il rilascio di iOS 18, iPadOS 18, macOS Sequoia e watchOS 11, l’Apple ID prende il nome di Apple Account per un’esperienza di accesso coerente in tutti i servizi e i dispositivi Apple. Le credenziali dell’utente restano invariate. ","web.portal.landing.faq.whenToUseAppleId":"Quando utilizzo il mio Apple Account?","web.portal.landing.faq.whenToUseAppleId.description":"Ogni volta che configuri un nuovo dispositivo, effettui un acquisto o usi un servizio Apple, ti verrà chiesto di effettuare l’accesso con l’email o il numero di telefono e la password del tuo Apple Account. Dopo che avrai effettuato l’accesso, potrai usufruire del servizio e di tutte le tue informazioni personali del tuo account. Usa lo stesso Apple Account ogni volta che effettui l’accesso, in modo che tutti i tuoi servizi e dispositivi Apple funzionino in perfetta sintonia e che tu possa accedere ai tuoi contenuti personali da tutti i tuoi dispositivi.","web.portal.landing.faq.seeAll":"Mostra tutte le domande frequenti","web.faq.question.whatIsAppleID":"Cos’è un Apple Account?","web.faq.answer.whatIsAppleId":"Un Apple Account è l’account personale con cui puoi accedere a servizi Apple come App Store, iCloud, Messaggi, Apple Online Store, FaceTime e altro ancora. Include i tuoi dati di accesso e tutte le informazioni di contatto, pagamento e sicurezza che userai nei servizi Apple.","web.faq.question.whenToUse":"Quando utilizzo il mio Apple Account?","web.faq.answer.whenToUse":"Ogni volta che configuri un nuovo dispositivo, effettui un acquisto o usi un servizio Apple, ti verrà chiesto di effettuare l’accesso con l’email o il numero di telefono e la password del tuo Apple Account. Dopo che avrai effettuato l’accesso, potrai usufruire del servizio e di tutte le tue informazioni personali.","web.faq.question.howMany":"Di quanti Apple Account ho bisogno?","web.faq.answer.howMany":"Ne basta uno. Usa lo stesso Apple Account ogni volta che effettui l’accesso, in modo che tutti i tuoi servizi e dispositivi Apple funzionino in perfetta sintonia e che tu possa accedere alle tue informazioni personali da tutti i tuoi dispositivi.","web.faq.question.mergeAccounts":"Se ho più Apple Account, posso unirli?","web.faq.answer.mergeAccounts":"Gli Apple Account sono destinati all’uso individuale e non possono essere uniti. ","web.faq.question.canShare":"Posso condividere un Apple Account con altri?","web.faq.answer.canShare":"L’Apple Account non deve essere condiviso, dato che fornisce l’accesso a informazioni personali come contatti, foto, backup dei dispositivi e altro ancora. Se condividi il tuo Apple Account, l’altra persona avrà accesso a tutti i tuoi contenuti personali e non sarà chiaro a chi appartiene l’account. Per condividere gli acquisti, le foto, un calendario e altri contenuti, prova \u003Ca href=\"https:\/\/support.apple.com\/HT201060\" target=\"_blank\"\u003E“In famiglia”\u003Cspan class=\"sr-only\"\u003E Si apre in una nuova finestra.\u003C\/span\u003E\u003C\/a\u003E, \u003Ca href=\"https:\/\/support.apple.com\/HT202786\" target=\"_blank\"\u003ECondivisione foto di iCloud\u003Cspan class=\"sr-only\"\u003E Si apre in una nuova finestra.\u003C\/span\u003E\u003C\/a\u003E o altre semplici funzioni di condivisione.","web.faq.question.keepSecure":"In che modo posso proteggere il mio Apple Account?","web.faq.answer.keepSecure":"La sicurezza e la privacy sono molto importanti per Apple e per questo offriamo molti modi per proteggere il tuo Apple Account e la tua privacy, come ad esempio password complesse, autenticazione a due fattori e altro ancora. Scopri di più su \u003Ca href=\"https:\/\/support.apple.com\/HT201303\" target=\"_blank\"\u003EApple Account e sicurezza\u003Cspan class=\"sr-only\"\u003E Si apre in una nuova finestra.\u003C\/span\u003E\u003C\/a\u003E.","web.faq.question.payForAccount":"L’Apple Account è a pagamento?","web.faq.answer.payForAccount":"No, non è previsto un pagamento per l’Apple Account. Scopri di più su come \u003Ca href=\"https:\/\/support.apple.com\/108647\" target=\"_blank\"\u003Ecreare un Apple Account\u003Cspan class=\"sr-only\"\u003E Si apre in una nuova finestra.\u003C\/span\u003E\u003C\/a\u003E. ","web.faq.moreInfo":"Per scoprire di più o per assistenza, \u003Ca href=\"https:\/\/support.apple.com\/apple-account\" target=\"_blank\"\u003Evisita il supporto Apple\u003Cspan class=\"sr-only\"\u003E Si apre in una nuova finestra.\u003C\/span\u003E\u003C\/a\u003E.","web.portal.qrc.landing.title":"Esegui l\'upgrade di questo profilo a un Apple Account","web.portal.qrc.landing.description1":"Con questo account, la persona che utilizza questo profilo potrà accedere ai dispositivi, effettuare acquisti in autonomia e utilizzare tutti i prodotti e servizi Apple.","web.portal.qrc.landing.description2":"La persona che gestisce questo profilo deve accedere con il proprio Apple Account per continuare. Dopodiché, la persona che utilizza il profilo dovrà completare i passaggi successivi.","web.portal.qrc.landing.well.title":"Come continuare a condividere acquisti e abbonamenti","web.portal.qrc.landing.well.description":"Una volta che il profilo sarà passato a un Apple Account, non sarà più possibile accedere agli acquisti e agli abbonamenti condivisi. Per continuare ad avere accesso, la persona che utilizzava il profilo e la persona che lo gestiva dovranno usare “In famiglia”.","web.portal.authWidget.title":"Apple Account","web.portal.authWidget.subtitle":"Gestisci il tuo Apple Account","web.portal.account.is.currently.deactivated.title":"L’account {0} è attualmente disattivato.","web.portal.account.reactivate.details.text":"Per riattivarlo, contatta il supporto Apple e comunica il codice di accesso a 12 cifre che hai ricevuto al momento della richiesta di disattivazione.","web.portal.icloud.hme.list.title":"Nascondi la mia email","web.portal.privacy.hme.create.
