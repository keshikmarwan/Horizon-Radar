<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <title>Fit Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
    canvas { display: block; width: 100%; height: 100%; cursor: pointer; position: absolute; inset: 0; z-index: 1; }
    .ui-panel {
      position: absolute;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: rgba(0, 0, 0, .7);
      border-radius: 12px;
      border: 1px solid rgba(255, 120, 50, .3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, .5);
      z-index: 10;
      padding: 15px;
      color: #eee;
    }
    #instructions-container { top: 20px; left: 20px; font-size: 14px; line-height: 1.5; max-width: 280px; }
    #instruction-title { font-weight: 600; margin-bottom: 6px; font-size: 15px; }
    #theme-selector { top: 20px; right: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 150px; }
    #theme-selector-title { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
    .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .theme-button { width: 36px; height: 36px; border-radius: 8px; border: 2px solid rgba(255, 255, 255, .3); cursor: pointer; transition: transform .2s, border-color .2s; outline: none; }
    .theme-button:hover, .theme-button:focus { transform: scale(1.05); border-color: rgba(255, 255, 255, .7); }
    .theme-button.active { transform: scale(1.05); border-color: rgba(255, 255, 255, .9); box-shadow: 0 0 10px rgba(255, 200, 150, .6); }
    #theme-1 { background: linear-gradient(45deg, #4F46E5, #7C3AED, #C026D3, #DB2777); }
    #theme-2 { background: linear-gradient(45deg, #F59E0B, #F97316, #DC2626, #7F1D1D); }
    #theme-3 { background: linear-gradient(45deg, #EC4899, #8B5CF6, #6366F1, #3B82F6); }
    #theme-4 { background: linear-gradient(45deg, #10B981, #A3E635, #FACC15, #FB923C); }
    #density-controls { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
    .density-label { font-size: 13px; display: flex; justify-content: space-between; }
    .density-slider { width: 100%; appearance: none; height: 4px; border-radius: 2px; background: rgba(255, 120, 50, .3); outline: none; cursor: pointer; }
    .density-slider::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border-radius: 50%; background: rgba(255, 120, 50, .8); }
    #control-buttons {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 10;
      background: rgba(0, 0, 0, .6);
      padding: 10px 15px;
      border-radius: 10px;
      border: 1px solid rgba(255, 120, 50, .2);
    }
    .control-button {
      background: rgba(255, 120, 50, .2);
      color: #eee;
      border: 1px solid rgba(255, 150, 50, .3);
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }
    .control-button:hover, .control-button:focus { background: rgba(255, 120, 50, .4); }
  </style>
</head>
<body>
  <div id="instructions-container" class="ui-panel">
    <div id="instruction-title">Interactive Neural Network</div>
    <div>Click or tap to create energy pulses through the network. Drag to rotate.</div>
  </div>

  <div id="theme-selector" class="ui-panel">
    <div id="theme-selector-title">Visual Theme</div>
    <div class="theme-grid">
      <button class="theme-button" id="theme-1" data-theme="0" aria-label="Theme 1"></button>
      <button class="theme-button" id="theme-2" data-theme="1" aria-label="Theme 2"></button>
      <button class="theme-button" id="theme-3" data-theme="2" aria-label="Theme 3"></button>
      <button class="theme-button" id="theme-4" data-theme="3" aria-label="Theme 4"></button>
    </div>
    <div id="density-controls">
      <div class="density-label"><span>Density</span><span id="density-value">100%</span></div>
      <input type="range" min="20" max="100" value="100" class="density-slider" id="density-slider" aria-label="Network Density">
    </div>
  </div>

  <div id="control-buttons">
    <button id="change-formation-btn" class="control-button">Formation</button>
    <button id="pause-play-btn" class="control-button">Pause</button>
    <button id="reset-camera-btn" class="control-button">Reset Cam</button>
  </div>

  <canvas id="neural-network-canvas"></canvas>

  <script>
    const canvas = document.getElementById('neural-network-canvas');
    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    const palettes = [
      ['#4F46E5','#7C3AED','#C026D3','#DB2777','#8B5CF6'],
      ['#F59E0B','#F97316','#DC2626','#7F1D1D','#FBBF24'],
      ['#EC4899','#8B5CF6','#6366F1','#3B82F6','#A855F7'],
      ['#10B981','#A3E635','#FACC15','#FB923C','#4ADE80'],
    ];

    let paletteIndex = 1;
    let paused = false;
    let formation = 0;
    let density = 1;
    let angle = 0;

    let nodes = [];
    let edges = [];
    let pulses = [];

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      rebuild();
    }

    function random(a, b) { return a + Math.random() * (b - a); }

    function rebuild() {
      const count = Math.floor(280 * density);
      nodes = [];
      edges = [];

      for (let i = 0; i < count; i++) {
        const t = i / Math.max(1, count - 1);
        let x = 0;
        let y = 0;

        if (formation % 4 === 0) {
          const r = Math.pow(Math.random(), 0.45) * Math.min(width, height) * 0.35;
          const a = Math.random() * Math.PI * 2;
          x = Math.cos(a) * r;
          y = Math.sin(a) * r;
        } else if (formation % 4 === 1) {
          const a = t * Math.PI * 8;
          const r = t * Math.min(width, height) * 0.32;
          x = Math.cos(a) * r;
          y = Math.sin(a) * r;
        } else if (formation % 4 === 2) {
          const cols = Math.floor(Math.sqrt(count));
          const row = Math.floor(i / cols);
          const col = i % cols;
          x = (col / cols - 0.5) * Math.min(width, height) * 0.8 + random(-10, 10);
          y = (row / cols - 0.5) * Math.min(width, height) * 0.8 + random(-10, 10);
        } else {
          const a = Math.random() * Math.PI * 2;
          const r = (0.2 + 0.8 * Math.sin(t * Math.PI)) * Math.min(width, height) * 0.35;
          x = Math.cos(a) * r + random(-20, 20);
          y = Math.sin(a) * r + random(-20, 20);
        }

        nodes.push({ x, y, z: random(-120, 120), c: i % 5, s: random(1.5, 3.2) });
      }

      // k-nearest simplified
      const maxLinks = 3;
      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        const distances = [];
        for (let j = 0; j < nodes.length; j++) {
          if (i === j) continue;
          const m = nodes[j];
          const dx = n.x - m.x;
          const dy = n.y - m.y;
          const d = dx * dx + dy * dy;
          distances.push([d, j]);
        }
        distances.sort((a, b) => a[0] - b[0]);
        for (let k = 0; k < maxLinks; k++) {
          const j = distances[k][1];
          if (i < j) edges.push([i, j]);
        }
      }
    }

    function project(node) {
      const cz = 320;
      const z = node.z;
      const p = cz / (cz + z);
      return {
        x: width * 0.5 + node.x * p,
        y: height * 0.5 + node.y * p,
        p,
      };
    }

    function triggerPulse(x, y) {
      pulses.push({ x, y, t: performance.now() });
      if (pulses.length > 6) pulses.shift();
    }

    function pulseIntensity(px, py, now) {
      let maxI = 0;
      for (const pulse of pulses) {
        const dt = (now - pulse.t) / 1000;
        if (dt < 0 || dt > 2.8) continue;
        const r = dt * 320;
        const d = Math.hypot(px - pulse.x, py - pulse.y);
        const ring = Math.max(0, 1 - Math.abs(d - r) / 24);
        const fade = Math.max(0, 1 - dt / 2.8);
        maxI = Math.max(maxI, ring * fade);
      }
      return maxI;
    }

    function draw(now) {
      if (!paused) {
        angle += 0.0022;
        for (const n of nodes) {
          const x = n.x;
          const z = n.z;
          n.x = x * Math.cos(0.002) - z * Math.sin(0.002);
          n.z = x * Math.sin(0.002) + z * Math.cos(0.002);
        }
      }

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);

      // stars
      for (let i = 0; i < 120; i++) {
        const sx = (Math.sin(now * 0.0001 + i * 12.9898) * 43758.5453) % 1;
        const sy = (Math.sin(now * 0.00013 + i * 78.233) * 12345.6789) % 1;
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fillRect((sx - Math.floor(sx)) * width, (sy - Math.floor(sy)) * height, 1.2, 1.2);
      }

      // edges
      for (const [i, j] of edges) {
        const a = project(nodes[i]);
        const b = project(nodes[j]);
        const mx = (a.x + b.x) * 0.5;
        const my = (a.y + b.y) * 0.5;
        const pi = pulseIntensity(mx, my, now);
        ctx.strokeStyle = `rgba(255,140,80,${0.08 + pi * 0.55})`;
        ctx.lineWidth = 1 + pi * 0.8;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      // nodes
      const pal = palettes[paletteIndex];
      for (const n of nodes) {
        const p = project(n);
        const pi = pulseIntensity(p.x, p.y, now);
        const r = (n.s * p.p) * (1 + pi * 1.8);
        const color = pal[n.c % pal.length];
        const alpha = 0.55 + p.p * 0.35 + pi * 0.4;

        ctx.beginPath();
        ctx.arc(p.x, p.y, r + 4 * pi, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${0.06 + pi * 0.3})`;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = color.replace(')', '').replace('rgb', 'rgba') + `,${Math.min(alpha, 1)})`;
        // fallback for hex
        if (color.startsWith('#')) ctx.fillStyle = color;
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    // ui
    document.querySelectorAll('.theme-button').forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        paletteIndex = idx;
        document.querySelectorAll('.theme-button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
    document.querySelector('.theme-button[data-theme="1"]').classList.add('active');

    const densitySlider = document.getElementById('density-slider');
    const densityValue = document.getElementById('density-value');
    densitySlider.addEventListener('input', () => {
      density = Number(densitySlider.value) / 100;
      densityValue.textContent = `${densitySlider.value}%`;
      rebuild();
    });

    document.getElementById('change-formation-btn').addEventListener('click', () => {
      formation = (formation + 1) % 4;
      rebuild();
    });

    const pauseBtn = document.getElementById('pause-play-btn');
    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      pauseBtn.textContent = paused ? 'Play' : 'Pause';
    });

    document.getElementById('reset-camera-btn').addEventListener('click', () => {
      for (const n of nodes) n.z = random(-120, 120);
    });

    canvas.addEventListener('click', (e) => triggerPulse(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if (t) triggerPulse(t.clientX, t.clientY);
    }, { passive: true });

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
